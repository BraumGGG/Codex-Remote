plugins { id "com.android.application" }

android {
    namespace "online.braumg.codexbridge"
    compileSdk 35

    defaultConfig {
        applicationId "online.braumg.codexbridge"
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName "0.1.0-beta.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "REMOTE_URL", '"https://remote.example.invalid:8443/remote/?shell=2026090106"'
        buildConfigField "String", "UI_BUILD", '"2026090106"'
        buildConfigField "String", "UPDATE_URL", '"https://remote.example.invalid:8443/android/update.json"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def store = System.getenv("CODEX_BRIDGE_ANDROID_KEYSTORE")
            if (store) {
                storeFile file(store)
                storePassword System.getenv("CODEX_BRIDGE_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("CODEX_BRIDGE_ANDROID_KEY_ALIAS") ?: "codex-bridge-beta"
                keyPassword System.getenv("CODEX_BRIDGE_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            minifyEnabled false
            if (System.getenv("CODEX_BRIDGE_ANDROID_KEYSTORE")) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    testImplementation "junit:junit:4.13.2"
}
